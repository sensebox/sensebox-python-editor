server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bundles can be updated independently of this image. Only the small
    # channel pointer changes; version directories are immutable.
    location /circuitpython/versions/ {
        root /var/lib/sensebox-libraries;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /circuitpython/ {
        root /var/lib/sensebox-libraries;
        try_files $uri @bundled_libraries;
        add_header Cache-Control "no-store";
    }

    location @bundled_libraries {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
